<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- @local/dsh-context-pilot 插件图标（家族风格：与 dsh-connect-zcode 同规范）
       语义：三条内容行 + 收拢箭头 = 上下文压缩（把长的上下文收进一点）；
             绿色收拢箭头 = 压缩动作（占用降档）；底部三点 = 生态家族视觉记忆。
       约定：64x64 / rx14 / 深底 #1e293b / 扁平无渐变，16px 下主形状仍可辨认。
       （旧版为 36 viewBox 渐变盾牌，与本家族规范不一致，2026-10-08 重绘。） -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#1e293b"/>
  <!-- 内容行：由长到短（被压缩的上下文） -->
  <path d="M14 14 H44" stroke="#7cc4ff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <path d="M14 24 H36" stroke="#7cc4ff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M14 34 H28" stroke="#7cc4ff" stroke-width="5" stroke-linecap="round"/>
  <!-- 绿色收拢箭头（右下指向，把行收进一点 = 压缩） -->
  <path d="M38 28 L48 38" stroke="#58c98f" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 30 V38 H40" stroke="#58c98f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 底部家族三点 -->
  <circle cx="20" cy="50" r="3" fill="#7cc4ff"/>
  <circle cx="31" cy="50" r="3" fill="#58c98f"/>
  <circle cx="42" cy="50" r="3" fill="#e8b64c"/>
</svg>
