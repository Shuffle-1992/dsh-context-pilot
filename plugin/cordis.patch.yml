# dsh-context-pilot 的 bundle 层 patch（**唯一身份**：dsh-context-pilot）
#
# 包名 = 本文件里的 name = 根 package.json 的 name = plugin/package.json 的 name。
# 加载器按 **包名** 解析，因此这四处必须一致；改包名时四处一起改（static 套件有断言兜底）。
#
# 机器专有配置（如阈值覆写）请放 ~/.dsh/profiles/<profile>/cordis.patch.yml 按 id 覆盖，不要写这里。
- insert:
    - id: dsh-context-pilot
      name: dsh-context-pilot
